apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: microservices-ingress
  namespace: job-system
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          # Service A - Job Submitter
          - path: /job
            pathType: Prefix
            backend:
              service:
                name: service-a
                port:
                  number: 5001

          # Service B - Worker
          - path: /worker
            pathType: Prefix
            backend:
              service:
                name: service-b
                port:
                  number: 5002

          # Service C - Stats
          - path: /stats
            pathType: Prefix
            backend:
              service:
                name: service-c
                port:
                  number: 5003

          # Health endpoints
          - path: /health/service-a
            pathType: Exact
            backend:
              service:
                name: service-a
                port:
                  number: 5001
          - path: /health/service-b
            pathType: Exact
            backend:
              service:
                name: service-b
                port:
                  number: 5002
          - path: /health/service-c
            pathType: Exact
            backend:
              service:
                name: service-c
                port:
                  number: 5003
